<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="50" y1="80" x2="150" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  <!-- Outer rounded hexagon / squircle -->
  <rect x="16" y="16" width="168" height="168" rx="44" fill="url(#bgGrad)"/>
  <!-- Radar/LiDAR waves on top -->
  <path d="M72 44C88 33 112 33 128 44" stroke="#7DD3FC" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M84 55C94 48 106 48 116 55" stroke="#BAE6FD" stroke-width="5" stroke-linecap="round"/>
  <!-- Robot head shell -->
  <rect x="44" y="66" width="112" height="82" rx="26" fill="#FFFFFF"/>
  <!-- Visor screen -->
  <rect x="56" y="80" width="88" height="44" rx="16" fill="url(#visorGrad)"/>
  <!-- Glowing eyes -->
  <rect x="70" y="94" width="18" height="16" rx="8" fill="url(#eyeGlow)"/>
  <rect x="112" y="94" width="18" height="16" rx="8" fill="url(#eyeGlow)"/>
  <!-- Status indicator bar -->
  <rect x="82" y="134" width="36" height="5" rx="2.5" fill="#94A3B8"/>
</svg>
